name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications (Windows, R 4.5.2)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nutrianalyse
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NUTRI_ENV: development

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restaurer l'environnement renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
          working-directory: nutrianalyse

      - name: Vérifier la synchronisation renv
        run: Rscript -e 'if (!isTRUE(renv::status()$synchronized)) quit(status = 1)'

      - name: Vérifier les dépendances déclarées
        run: Rscript tools/check_dependencies.R

      - name: Interdire les secrets dans les fichiers versionnés
        shell: bash
        working-directory: .
        run: |
          if git grep -nE 'AIzaSy[0-9A-Za-z_-]{30,}' -- '*.R' '*.md' '*.txt' '*.yml' '*.yaml'; then
            echo "::error::Clé API en clair détectée dans le dépôt"
            exit 1
          fi

      - name: Vérifier le chargement de l'application
        run: Rscript tools/check_app.R

      - name: Vérifier la session serveur
        run: Rscript tools/check_server.R

      - name: Tests unitaires
        run: Rscript tools/run_tests.R

      - name: Vérifier les modules experts
        run: Rscript tools/check_expert_modules.R
